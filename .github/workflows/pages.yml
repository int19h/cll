name: pages

# Builds the published book site and deploys it to GitHub Pages.
#
# The site is multi-version: pages/versions.tsv maps each published
# version to the git ref that holds its content, and every listed version
# is built from its ref, or, once published, served from the book files of
# its release with freshly built diffs. Each result is cached as
# cll-<version>-html.tar.gz in the site-build-cache draft release, and later
# runs restore it from there (issue #128, scripts/build-versions.sh).
# The three visual diffs of each version are computed on the DocBook
# sources (scripts/docbook-diff.py, issue #127) against the sources of the
# official CLL 1.1, of UnCLL 1.2.16 (baseline/uncll-1.2.16), and of the
# previous release; they need only those refs, not their builds.
#
# Each version lists its formats in the third column of versions.tsv
# (scripts/site-versions.sh). A tool is installed only when some version
# lists a format that needs it. WeasyPrint and Typst build natively.
# ConTeXt uses the version's own container launcher.
#
# Trigger manually (workflow_dispatch) after updating a version's content
# branch, or automatically when the pages branch (workflow/scripts) changes.

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Ignore the build cache (unpublished versions rebuild from source, published versions rebuild their diffs; published releases never change)
        type: boolean
        default: false
  push:
    branches: [pages]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write          # upload the per-version archives to the releases
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pages branch (workflow + build scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0            # need all branches for per-version worktrees

      - name: Make all content refs available
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Read the formats of the versions
        id: formats
        run: |
          . scripts/site-versions.sh
          all="$(site_rows pages/versions.tsv | cut -f3 | paste -sd, -)"
          echo "versions.tsv lists: $all"
          for toolchain in $(site_toolchains "$(site_formats "$all")"); do
            echo "$toolchain=true" >> "$GITHUB_OUTPUT"
          done

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xmlto xsltproc libxml2-utils tidy zip unzip locales \
            build-essential pkg-config libxml2-dev libxslt1-dev zlib1g-dev
          sudo locale-gen en_US.UTF-8
          sudo ln -sf /bin/bash /bin/sh          # build scripts assume sh == bash
          # pinned to the same versions as the reviewed build container
          # (Dockerfile) so CI output does not drift as new releases land
          sudo gem install --no-document nokogiri:1.18.8 optimist:3.2.0 htmlentities:4.3.4
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          sudo npm install -g regenerator@0.14.12

      - name: Install a JRE (ePub check)
        if: steps.formats.outputs.java == 'true'
        run: sudo apt-get install -y --no-install-recommends default-jre-headless

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.formats.outputs.weasyprint == 'true'
        with: { node-version: '24.22.1' }

      - name: Install WeasyPrint runtime libraries
        if: steps.formats.outputs.weasyprint == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends python3-venv \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core fonts-linuxlibertine

      - name: Make sure that Docker works (container toolchain)
        if: steps.formats.outputs.container == 'true'
        run: docker info >/dev/null

      - name: Install Prince (PDF renderer)
        if: steps.formats.outputs.prince == 'true'
        run: |
          # same version as the reviewed build container (Dockerfile)
          wget -q "https://www.princexml.com/download/prince_16.2-1_ubuntu24.04_amd64.deb"
          sudo apt-get install -y ./prince_16.2-1_ubuntu24.04_amd64.deb
          prince --version

      - name: Resolve the baseline ref
        id: baseline
        run: echo "sha=$(git rev-parse origin/baseline/uncll-1.2.16)" >> "$GITHUB_OUTPUT"

      - name: Build or restore each published version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          BASELINE_COMMIT: ${{ steps.baseline.outputs.sha }}
          CONTAINER_BIN: docker
        # A published version serves the book files of its release and
        # rebuilds only its diffs; other versions build from source. Each
        # result is cached in the site-build-cache draft release and restored
        # when it still matches. Draft releases get the files of the
        # version's formats; published releases never change (issue #128).
        # See scripts/build-versions.sh.
        run: bash scripts/build-versions.sh pages/versions.tsv origin/baseline/uncll-1.2.16 "$PWD/_site_versions"

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -pr _site_versions/. _site/

      - name: Generate landing pages
        run: bash scripts/gen-site-index.sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
