name: checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  xml-wellformed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install libxml2-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Assemble book (build header + chapters) and check well-formedness
        run: |
          { cat scripts/header.xml chapters/*.xml; echo '</book>'; } > book-assembled.xml
          set +e
          err=$(xmllint --loaddtd --noent --noout book-assembled.xml 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then echo "$err"; exit $rc; fi
          # undefined entities surface only as warnings; treat them as failures
          if echo "$err" | grep -q 'not defined\|parser error'; then echo "$err"; exit 1; fi
          echo "book well-formed ($(ls chapters/*.xml | wc -l) chapters)"

  cmevla-dot-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Flag undotted cmevla after la/lai/la'i/doi in Lojban text
        run: python3 scripts/lint-undotted-cmevla.py chapters/*.xml
      - name: EBNF cross-reference check
        run: python3 scripts/check-cross-reference.py chapters/21.xml
      - name: Status-markup lint
        run: python3 scripts/lint-status-markup.py chapters/*.xml
      - name: Status-markup lint self-test
        run: python3 scripts/test-lint-status-markup.py
      - name: PEG appendix matches the machine-readable grammar
        run: python3 scripts/check-peg-appendix.py
      - name: PEG appendix check self-test
        run: python3 scripts/test-check-peg-appendix.py

  # scripts/xml_prince_postprocess.rb is the last thing to touch the XHTML
  # before Prince renders the PDF, and it works by regex over serialized
  # output. Issue #106 (a chapter heading whose text content read
  # "Chapter 21Formal grammars" in the PDF outline) was invisible to every
  # other check here. Its own job, not a step of cmevla-dot-lint: that one is
  # pure Python, and bolting a Ruby runtime plus a native gem onto it would
  # make both its name and its dependency profile misleading.
  prince-postprocess-smoke:
    # ubuntu-24.04 to match the Dockerfile's base image and the Pages builder.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
      # Deliberately not bundler-cache: the checked-in Gemfile.lock resolves
      # nokogiri 1.10.4, while the Dockerfile and the Pages build both install
      # 1.18.8. Testing 1.10.4 would characterize a version we never release.
      # Reconciling the manifest with the released pins is separate work.
      - name: Install the production Nokogiri version
        run: gem install --no-document nokogiri:1.18.8
      - name: Prince postprocessor smoke test
        run: |
          ruby -rnokogiri -e 'puts "Nokogiri #{Nokogiri::VERSION}"; abort "expected Nokogiri 1.18.8" unless Nokogiri::VERSION == "1.18.8"'
          python3 scripts/test-xml-prince-postprocess.py

  parser-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24' }
      - name: Fetch ilmentufa at the pinned commit
        run: |
          mkdir ../ilmentufa && cd ../ilmentufa
          git init -q
          git remote add origin https://github.com/lojban/ilmentufa
          git fetch -q --depth 1 origin 778ea138f7d150121ca722db7536ce3b123943ac
          git checkout -q FETCH_HEAD
      - name: Run magic-word probes
        run: ILMENTUFA_DIR=../ilmentufa node tests/run-probes.js

  example-validation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24' }
      - name: Fetch ilmentufa at the pinned commit
        run: |
          mkdir ../ilmentufa && cd ../ilmentufa
          git init -q
          git remote add origin https://github.com/lojban/ilmentufa
          git fetch -q --depth 1 origin 778ea138f7d150121ca722db7536ce3b123943ac
          git checkout -q FETCH_HEAD
      - name: Extract and parse all Lojban examples (report-only)
        run: |
          python3 scripts/extract-examples.py chapters/*.xml > /tmp/examples.tsv
          ILMENTUFA_DIR=../ilmentufa node scripts/validate-examples.js /tmp/examples.tsv 2>&1 | tee example-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: example-report
          path: example-report.txt
          if-no-files-found: warn
