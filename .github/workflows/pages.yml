name: pages

# Builds the published book site and deploys it to GitHub Pages.
#
# The site is multi-version: pages/versions.tsv maps each published
# version to the git ref that holds its content, and every listed version
# is rebuilt from its ref on each run (nothing generated is kept in git).
# UnCLL 1.2.16 is built once from baseline/uncll-1.2.16 (upstream's
# geklojban-development content plus the modern build fixes) as the
# baseline for the per-version "diff vs UnCLL". That branch is frozen, so
# its build is cached on the ref's own SHA and normally restored rather
# than rebuilt (~10 min of the run).
#
# Trigger manually (workflow_dispatch) after updating a version's content
# branch, or automatically when the pages branch (workflow/scripts) changes.

on:
  workflow_dispatch:
  push:
    branches: [pages]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pages branch (workflow + build scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0            # need all branches for per-version worktrees

      - name: Make all content refs available
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xmlto xsltproc libxml2-utils tidy zip unzip locales \
            build-essential pkg-config libxml2-dev libxslt1-dev zlib1g-dev \
            default-jre-headless
          sudo locale-gen en_US.UTF-8
          sudo ln -sf /bin/bash /bin/sh          # build scripts assume sh == bash
          # pinned to the same versions as the reviewed build container
          # (Dockerfile) so CI output does not drift as new releases land
          sudo gem install --no-document nokogiri:1.18.8 optimist:3.2.0 htmlentities:4.3.4
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          sudo npm install -g regenerator@0.14.12

      - name: Install Prince (PDF renderer)
        run: |
          # same version as the reviewed build container (Dockerfile)
          wget -q "https://www.princexml.com/download/prince_16.2-1_ubuntu24.04_amd64.deb"
          sudo apt-get install -y ./prince_16.2-1_ubuntu24.04_amd64.deb
          prince --version

      - name: Resolve the baseline ref
        id: baseline
        run: echo "sha=$(git rev-parse origin/baseline/uncll-1.2.16)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached baseline build
        id: baseline-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _baseline/build/xhtml_no_chunks
          # keyed on the baseline commit itself: a hit means the exact same
          # tree was built before. Bump the suffix to force a rebuild if the
          # toolchain above changes in a way that affects the output.
          key: baseline-xhtml_no_chunks-v1-${{ steps.baseline.outputs.sha }}

      - name: Build UnCLL 1.2.16 baseline (baseline/uncll-1.2.16)
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          git worktree add --detach _baseline origin/baseline/uncll-1.2.16
          ( cd _baseline && ./cll_build -n -T xhtml_nochunks )

      - name: Check the baseline build is usable
        run: test -s _baseline/build/xhtml_no_chunks/index.html

      - name: Resolve the published versions' refs
        id: versions
        run: |
          shas=$(while IFS=$'\t' read -r ver ref; do
            case "$ver" in ''|'#'*) continue ;; esac
            printf '%s=%s\n' "$ver" "$(git rev-parse "origin/$ref")"
          done < pages/versions.tsv)
          echo "$shas"
          echo "hash=$(echo "$shas" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached version builds
        id: site-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _site_versions
          # a hit means the exact same content refs were built by the same
          # site scripts; bump the suffix to force a rebuild on toolchain
          # changes that affect the output.
          key: site-versions-v1-${{ hashFiles('scripts/build-site.sh') }}-${{ steps.versions.outputs.hash }}

      - name: Build each published version
        if: steps.site-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p _site_versions
          # oldest first, so each version's fresh build can serve as the
          # "previous release" side of the next version's diff_from_previous
          prev=""; prevlabel=""
          tac pages/versions.tsv | while IFS=$'\t' read -r ver ref; do
            case "$ver" in ''|'#'*) continue ;; esac
            echo "::group::build $ver from $ref"
            git worktree add --detach "_v_$ver" "origin/$ref"
            bash scripts/build-site.sh "_v_$ver" "$ver" \
              "$PWD/_baseline/build/xhtml_no_chunks" "$PWD/_site_versions" \
              "$prev" "$prevlabel"
            prev="$PWD/_site_versions/$ver/xhtml_no_chunks"
            prevlabel="v$ver"
            echo "::endgroup::"
          done

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -pr _site_versions/. _site/

      - name: Generate landing pages
        run: bash scripts/gen-site-index.sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
