name: checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  xml-wellformed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install libxml2-utils and Pillow
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils python3-pil
      - name: Branch build format dispatch and preview guard
        run: |
          python3 scripts/test-build-actions.py
          ruby scripts/test-build-workflow.rb
      - name: Makefile archives and incremental inputs
        run: python3 scripts/test-makefile.py
      - name: Build helper failure and dictionary refresh tests
        run: python3 scripts/test-build-helpers.py
      - name: XHTML formatting preserves inline spaces
        run: python3 scripts/test-xhtml-format.py
      - name: Chapter artwork references and PNGs
        run: python3 scripts/test-chapter-pictures.py
      - name: Assemble book (build header + chapters) and check well-formedness
        run: |
          { cat scripts/header.xml chapters/*.xml; echo '</book>'; } > book-assembled.xml
          set +e
          err=$(xmllint --loaddtd --noent --noout book-assembled.xml 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then echo "$err"; exit $rc; fi
          # undefined entities and duplicate IDs surface only as warnings; treat them as failures
          if echo "$err" | grep -q 'not defined\|parser error\|already defined'; then echo "$err"; exit 1; fi
          echo "book well-formed ($(ls chapters/*.xml | wc -l) chapters)"

  cmevla-dot-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test dotside lint input
        run: python3 scripts/test-lint-undotted-cmevla.py
      - name: Flag undotted cmevla after la/lai/la'i/doi in Lojban text
        run: python3 scripts/lint-undotted-cmevla.py chapters/*.xml
      - name: Test example extraction
        run: python3 scripts/test-extract-examples.py
      - name: EBNF cross-reference check
        run: python3 scripts/check-cross-reference.py chapters/21.xml
      - name: EBNF cross-reference check self-test
        run: python3 scripts/test-check-cross-reference.py
      - name: Status-markup lint
        run: python3 scripts/lint-status-markup.py chapters/*.xml
      - name: Status-markup lint self-test
        run: python3 scripts/test-lint-status-markup.py
      - name: Browser MathJax version and integrity
        run: python3 scripts/test-html-mathjax.py
      - name: PEG word-form grammar in chapter 21 matches the machine-readable grammar
        run: python3 scripts/check-peg-grammar.py
      - name: PEG grammar check self-test
        run: python3 scripts/test-check-peg-grammar.py
      - name: Container dependency pins
        run: python3 scripts/test-build-pins.py

  # The PDF running head and the ePub must name this edition, from .env
  # (issue #121). The check fills the ePub templates without a book build.
  edition-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Running head and ePub name the edition from .env
        run: scripts/check-edition-branding.sh
      - name: Install ePub packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils zip unzip curl default-jre-headless
      - name: Package ePub assets without renderer sources
        run: python3 scripts/test-build-epub.py
      - name: Install pinned EPUBCheck
        run: ./scripts/install-epubcheck.sh build/tools/epubcheck
      - name: EPUBCheck pin and error status
        run: python3 scripts/test-epubcheck.py

  # The ePub navigation document is written from the DocBook source (issue #208).
  epub-nav:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
      - name: Install xsltproc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xsltproc
      - name: Install the production Nokogiri version
        run: gem install --no-document nokogiri:1.18.8
      - name: ePub navigation document
        run: |
          ruby -rnokogiri -e 'puts "Nokogiri #{Nokogiri::VERSION}"; abort "expected Nokogiri 1.18.8" unless Nokogiri::VERSION == "1.18.8"'
          python3 scripts/test-epub-nav.py

  # scripts/xml_prince_postprocess.rb is the last thing to touch the XHTML
  # before Prince renders the PDF, and it works by regex over serialized
  # output. Issue #106 (a chapter heading whose text content read
  # "Chapter 21Formal grammars" in the PDF outline) was invisible to every
  # other check here. Its own job, not a step of cmevla-dot-lint: that one is
  # pure Python, and bolting a Ruby runtime plus a native gem onto it would
  # make both its name and its dependency profile misleading.
  prince-postprocess-smoke:
    # ubuntu-24.04 to match the Dockerfile's base image and the Pages builder.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
      # Gemfile.lock records the production pins. This job still installs the
      # gems directly, as the Dockerfile does, so the check does not depend on Bundler.
      - name: Install libxml2-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Install the production Nokogiri, Optimist, and HTMLEntities gems
        run: gem install --no-document nokogiri:1.18.8 optimist:3.2.0 htmlentities:4.3.4
      - name: Prince postprocessor smoke test
        run: |
          ruby -rnokogiri -e 'puts "Nokogiri #{Nokogiri::VERSION}"; abort "expected Nokogiri 1.18.8" unless Nokogiri::VERSION == "1.18.8"'
          python3 scripts/test-xml-prince-postprocess.py
          python3 scripts/test-offline-list.py
          python3 scripts/test-nokogiri-spaces.py
      - name: Gloss column lint self-test
        run: ruby scripts/test-lint-gloss-columns.rb
      - name: Interlinear gloss columns
        run: ruby scripts/lint-gloss-columns.rb chapters/*.xml
      - name: Index type lint self-test
        run: ruby scripts/test-lint-index-types.rb
      - name: Index types
        run: ruby scripts/lint-index-types.rb chapters/*.xml
      - name: Branding values in the merged book
        run: ruby scripts/test-merge-branding.rb
      - name: Partial builds resolve every cross-reference
        run: ruby scripts/test-partial-references.rb
      - name: Glossary cache and colliding spellings
        run: ruby scripts/test-generate-glossary.rb
      - name: Word spelling lint self-test
        run: ruby scripts/test-lint-word-spellings.rb
      - name: CGV and comma spellings
        run: ruby scripts/lint-word-spellings.rb chapters/*.xml
      - name: Glossary links in jbophrase frames
        run: ruby scripts/test-jbophrase-frames.rb
      - name: Index type lint self-test
        run: ruby scripts/test-lint-index-types.rb
      - name: Index term types
        run: ruby scripts/lint-index-types.rb chapters/*.xml
      - name: Branding values survive merge
        run: ruby scripts/test-merge-branding.rb
      - name: Partial builds retarget omitted references
        run: ruby scripts/test-partial-references.rb
      - name: Glossary cache and ids
        run: ruby scripts/test-generate-glossary.rb

  typst-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
      - name: Install the production Nokogiri version
        run: gem install --no-document nokogiri:1.18.8
      - name: Install the pinned Typst compiler
        run: bash scripts/install_typst.sh "$RUNNER_TEMP/typst"
      - name: Test DocBook conversion and native math spacing
        run: TYPST="$RUNNER_TEMP/typst/typst" ruby scripts/test_docbook_to_typst.rb

  weasyprint-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24.22.1' }
      - name: Install PDF runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-linuxlibertine
      - name: Install the pinned WeasyPrint and MathJax dependencies
        run: ./scripts/install-weasyprint.sh
      - name: Render math and linked index fixtures
        run: |
          python3 scripts/test-build-version.py
          PYTHONDONTWRITEBYTECODE=1 build/weasyprint-tools/venv/bin/python scripts/test-weasyprint.py

  context-converter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check build script syntax
        run: bash -n cll_build run_context_container.sh scripts/build_context.sh
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
      - run: gem install --no-document nokogiri:1.18.8
      - run: ruby scripts/test-docbook-to-context.rb
      - run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: /usr/bin/python3 scripts/test-context-assets.py

  parser-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24' }
      - name: Fetch ilmentufa at the pinned commit
        run: |
          mkdir ../ilmentufa && cd ../ilmentufa
          git init -q
          git remote add origin https://github.com/lojban/ilmentufa
          git fetch -q --depth 1 origin 778ea138f7d150121ca722db7536ce3b123943ac
          git checkout -q FETCH_HEAD
      - name: Reviewed comma syllables
        run: ILMENTUFA_DIR=../ilmentufa node scripts/check-comma-syllables.js
      - name: Test parser invocation failures
        run: node tests/test-run-probes.js
      - name: Test audio loading failures
        run: node tests/test-audio-loading.js
      - name: Test the offline worker and its registration
        run: |
          node tests/test-offline-worker.js
          node tests/test-offline-register.js
      - name: Test the Prince index audit
        run: |
          node tests/test-prince-index-guard.js
          node tests/test-prince-index-prep.js
      - name: Test Prince index page ranges
        run: node tests/test-prince-index.js
      - name: Run magic-word probes
        run: ILMENTUFA_DIR=../ilmentufa node tests/run-probes.js

  example-validation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: '24' }
      - name: Fetch ilmentufa at the pinned commit
        run: |
          mkdir ../ilmentufa && cd ../ilmentufa
          git init -q
          git remote add origin https://github.com/lojban/ilmentufa
          git fetch -q --depth 1 origin 778ea138f7d150121ca722db7536ce3b123943ac
          git checkout -q FETCH_HEAD
      - name: Extract and parse all Lojban examples (report-only)
        run: |
          python3 scripts/extract-examples.py chapters/*.xml > /tmp/examples.tsv
          ILMENTUFA_DIR=../ilmentufa node scripts/validate-examples.js /tmp/examples.tsv 2>&1 | tee example-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: example-report
          path: example-report.txt
          if-no-files-found: warn
